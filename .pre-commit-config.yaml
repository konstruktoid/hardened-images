---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        args: [-x, -s, bash, -f, gcc]
        types: [file]
        files: ^(build_box\.sh|run_qemu\.sh|azure_vars_export|scripts/.*\.sh|tools/.*\.sh)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        files: ^config/.*\.ya?ml$

  - repo: local
    hooks:
      - id: packer-fmt
        name: packer fmt
        language: system
        entry: packer fmt -check -diff
        files: \.pkr\.hcl$
        pass_filenames: true
