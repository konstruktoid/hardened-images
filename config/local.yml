---
- name: Checkout and configure konstruktoid.hardening
  hosts: localhost
  any_errors_fatal: true
  gather_facts: true

  vars:
    hardening_role_version: v4.4.1
    hardening_role_repo: https://github.com/konstruktoid/ansible-role-hardening
    hardening_role_path: /etc/ansible/roles/konstruktoid.hardening

  tasks:
    - name: Clone hardening repository
      become: true
      tags:
        - always
      block:
        - name: Install git
          ansible.builtin.package:
            name: git
            state: present

        - name: Checkout konstruktoid.hardening
          ansible.builtin.git:
            repo: "{{ hardening_role_repo }}"
            dest: "{{ hardening_role_path }}"
            version: "{{ hardening_role_version }}"

        - name: Remove git
          ansible.builtin.package:
            name: git
            state: absent

    - name: Include the hardening role
      ansible.builtin.include_role:
        name: konstruktoid.hardening
      vars:
        auditd_apply_audit_rules: false
        manage_aide: false
        manage_ufw: false
        sshd_allow_groups:
          - sudo
          - ubuntu
        sshd_allow_users: []
        sshd_login_grace_time: 60
        sshd_max_auth_tries: 10
        sshd_password_authentication: true
        sshd_permit_root_login: false
        sshd_update_moduli: true
        sshd_use_dns: false
        suid_sgid_permissions: false
